<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task-6</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <!-- LEFT SECTION -->
    <div class="container-1">
      <img
        src="https://th.bing.com/th/id/OIP.RE1NXffHee-BZICS7hW1OwHaEG?w=297&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
        alt="Laundry Image"
      />
    </div>

    <!-- RIGHT SECTION -->
    <div class="container-2">
      <div class="box-1">
        <div class="heading-section">
          <h1>Hello Again!</h1>
          <p>Welcome back! We missed you!</p>
        </div>

        <form class="mailcontainer">
          <!-- EMAIL -->
          <div class="email-box">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              placeholder="Emailid@site.com"
              minlength="5"
              maxlength="30"
              required
            />
          </div>

          <!-- PASSWORD -->
          <div class="password-box">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              placeholder="Password"
              required
            />
          </div>

          <!-- FORGOT PASSWORD -->
          <div class="password-recovery">
            <a href="#">Forgot Password?</a>
          </div>

          <!-- LOGIN BUTTON -->
          <div class="login-box">
            <button type="submit">Login</button>
          </div>

          <!-- REGISTER -->
          <p class="register-text">
            Not a member?
            <a href="#">Register now</a>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
